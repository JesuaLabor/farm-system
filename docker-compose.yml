# ============================================================
#  docker-compose.yml — Farm System Local Dev Stack
#  Services:
#    - frontend  → Next.js  (http://localhost:3000)
#    - firebase  → Firebase Emulators
#      ↳ Emulator UI   → http://localhost:4000
#      ↳ Firestore     → http://localhost:8080
#      ↳ Auth          → http://localhost:9099
# ============================================================

services:

  # ── Firebase Emulators (Local Backend) ───────────────────
  firebase:
    build:
      context: .
      dockerfile: Dockerfile.firebase
    container_name: farm-firebase
    ports:
      - "4000:4000"   # Emulator UI
      - "8080:8080"   # Firestore
      - "9099:9099"   # Auth
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Next.js Frontend ─────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farm-frontend
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Preserve container's node_modules (don't override with host)
      - /app/node_modules
      # Preserve Next.js build cache
      - /app/.next
    env_file:
      # Load your Firebase credentials from .env.local
      - .env.local
    environment:
      # Point Firebase SDK to local emulators
      - NEXT_PUBLIC_FIREBASE_EMULATOR_HOST=localhost
      - NEXT_PUBLIC_FIRESTORE_EMULATOR_PORT=8080
      - NEXT_PUBLIC_AUTH_EMULATOR_PORT=9099
      - WATCHPACK_POLLING=true
    depends_on:
      firebase:
        condition: service_healthy
    restart: unless-stopped
